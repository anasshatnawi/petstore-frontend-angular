<div class="container">
  <div class="header">
    <h2>Users</h2>
    <button (click)="fetchUsers()" class="refresh-button">Refresh Users</button>
  </div>
  <!-- EDIT FORM -->
  <div class="form-container" *ngIf="editingUser">
    <h3>Edit User {{ editingUser.id }}</h3>
    <form #editForm="ngForm" (ngSubmit)="updateUser(editForm)" class="form">
      <input
        type="email"
        [(ngModel)]="editingUser.email"
        name="emailEdit"
        placeholder="Email"
        required
        autoComplete="off"
        #emailEdit="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="editingUser.username"
        name="usernameEdit"
        placeholder="Username"
        required
        autoComplete="off"
        #usernameEdit="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="editingUser.firstname"
        name="firstnameEdit"
        placeholder="First Name"
        required
        autoComplete="off"
        #firstnameEdit="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="editingUser.lastname"
        name="lastnameEdit"
        placeholder="Last Name"
        required
        autoComplete="off"
        #lastnameEdit="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="editingUser.phone"
        name="phoneEdit"
        placeholder="Phone"
      />

      <select
        [(ngModel)]="editingUser.status"
        name="statusEdit"
        required
        #statusEdit="ngModel"
      >
        <option value="" disabled>Select Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

      <button type="submit" class="submit-button">Update User</button>
      <button type="button" class="cancel-button" (click)="cancelEdit()">
        Cancel
      </button>
    </form>
  </div>

  <!-- CREATE FORM -->
  <div class="form-container">
    <h3>Create New User</h3>
    <form #createForm="ngForm" (ngSubmit)="createUser(createForm)" class="form">
      <input
        type="email"
        [(ngModel)]="newUser.email"
        name="email"
        placeholder="Email"
        required
        autoComplete="off"
        #email="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="newUser.username"
        name="username"
        placeholder="Username"
        required
        autoComplete="off"
        #username="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="newUser.firstname"
        name="firstname"
        placeholder="First Name"
        required
        autoComplete="off"
        #firstname="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="newUser.lastname"
        name="lastname"
        placeholder="Last Name"
        required
        autoComplete="off"
        #lastname="ngModel"
      />

      <input
        type="text"
        [(ngModel)]="newUser.phone"
        name="phone"
        placeholder="Phone"
      />

      <select
        [(ngModel)]="newUser.status"
        name="status"
        required
        #status="ngModel"
      >
        <option value="" disabled>Select Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

      <button type="submit" class="submit-button" (click)="print()">
        Create User
      </button>
    </form>
  </div>

  <ul class="list">
    <li *ngFor="let user of users" class="list-item">
      <div>
        <strong>{{ user.username }}</strong
        ><br />
        {{ user.firstname }} {{ user.lastname }}<br />
        Email: {{ user.email }}<br />
        Phone: {{ user.phone }}<br />
        Status: {{ user.status }}
      </div>
      <div class="button-group">
        <button class="edit-button" (click)="editUser(user)">Edit</button>
        <button class="delete-button" (click)="deleteUser(user.id)">
          Delete
        </button>
      </div>
    </li>
  </ul>
</div>
